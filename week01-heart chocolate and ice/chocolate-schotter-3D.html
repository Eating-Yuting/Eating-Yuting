<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schotter³ — Chocolate Edition</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #faf8f4;
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
  #ui { position: fixed; top: 16px; left: 16px; z-index: 10; background: rgba(255,255,255,0.75);
    backdrop-filter: blur(8px); border-radius: 14px; padding: 14px 18px;
    box-shadow: 0 4px 18px rgba(60,35,15,0.12); color: #4a2c14; max-width: 300px; }
  #ui h1 { font-size: 17px; margin: 0 0 4px; }
  #ui p { font-size: 12px; margin: 0 0 10px; color: #8a6a4f; }
  #ui .row { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; }
  #ui input[type=range] { flex: 1; accent-color: #7a4a2b; }
  #ui button { background: #5b3319; color: #fff7ee; border: none; border-radius: 8px;
    padding: 6px 12px; font-size: 13px; cursor: pointer; }
  #ui button:hover { background: #7a4a2b; }
  #hint { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
    font-size: 12px; color: #a08060; background: rgba(255,255,255,0.6);
    padding: 5px 12px; border-radius: 10px; }
</style>
</head>
<body>
<div id="ui">
  <h1>🍫 Schotter³ — Chocolate Edition</h1>
  <p>Georg Nees, 1968 — remade as a breaking chocolate bar. Drag to orbit, scroll to zoom.</p>
  <div class="row"><span>CHAOS</span><input id="chaos" type="range" min="0" max="1.5" step="0.05" value="1"><span id="chaosVal">1.00</span></div>
  <div class="row"><button id="newBar">🍫 new bar</button><button id="replay">↺ replay break</button></div>
</div>
<div id="hint">drag to rotate · scroll to zoom</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const COLS = 12, ROWS = 22, S = 1, H = 0.65;

let seed = 5913, chaos = 1.0, t = 0, breaking = true;
let pieces = [], barGroup = null;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xfaf8f4);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
const target = new THREE.Vector3(0, 0, 0);
let theta = -0.7, phi = 1.05, radius = 26;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xfff5e8, 0x3a2418, 0.95));
const sun = new THREE.DirectionalLight(0xffffff, 0.85);
sun.position.set(12, 24, 10);
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffe8d0, 0.3);
fill.position.set(-10, 8, -14);
scene.add(fill);

// seeded random so the same seed always makes the same bar
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let x = Math.imul(a ^ (a >>> 15), 1 | a);
    x = (x + Math.imul(x ^ (x >>> 7), 61 | x)) ^ x;
    return ((x ^ (x >>> 14)) >>> 0) / 4294967296;
  };
}

function chocMaterial(rng) {
  const color = new THREE.Color().setHSL(0.07 + rng() * 0.02, 0.52, 0.20 + rng() * 0.10);
  return new THREE.MeshStandardMaterial({
    color, roughness: 0.45 + rng() * 0.25, metalness: 0.04
  });
}

function addPiece(dims, pos, rotBase, dir, rotDir, mat) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(dims[0], dims[1], dims[2]), mat);
  mesh.position.copy(pos);
  mesh.rotation.set(rotBase.x, rotBase.y, rotBase.z);
  barGroup.add(mesh);
  pieces.push({ mesh, base: pos.clone(), dir, rotBase, rotDir });
}

function buildBar() {
  if (barGroup) { scene.remove(barGroup); barGroup = null; }
  pieces = [];
  barGroup = new THREE.Group();
  const rng = mulberry32(seed);

  for (let row = 0; row < ROWS; row++) {
    const damage = chaos * Math.pow(row / ROWS, 2);
    for (let col = 0; col < COLS; col++) {
      const x = (col - (COLS - 1) / 2) * S;
      const z = (row - (ROWS - 1) / 2) * S;
      const willBreak = damage > 0.14 && rng() < Math.min(1, damage * 1.25);

      if (!willBreak) {
        // intact square: only a small wobble, like the calm top of Schotter
        const rotBase = { x: 0, y: (rng() - 0.5) * damage * 1.4, z: 0 };
        addPiece(
          [S * 0.98, H, S * 0.98],
          new THREE.Vector3(x + (rng() - 0.5) * damage * 0.5, 0, z + (rng() - 0.5) * damage * 0.5),
          rotBase,
          new THREE.Vector3((rng() - 0.5) * damage * 0.4, 0, (rng() - 0.5) * damage * 0.4),
          new THREE.Vector3(0, 0, 0),
          chocMaterial(rng)
        );
        continue;
      }

      // break the square into 2–3 chunks along a random fault line
      const axisX = rng() < 0.5;
      const n = 2 + (rng() < damage * 0.9 ? 1 : 0);
      const gap = 0.05 + damage * 0.12;
      let cuts = [];
      for (let i = 1; i < n; i++) cuts.push(0.15 + (0.7 / n) * i + (rng() - 0.5) * 0.18);
      cuts.sort((a, b) => a - b);
      let starts = [0], ends = [];
      for (const c of cuts) { ends.push(c); starts.push(c); }
      ends.push(1);
      const baseRotY = (rng() - 0.5) * damage * 1.6;

      for (let i = 0; i < n; i++) {
        const w = Math.max(0.08, (ends[i] - starts[i]) - gap / n);
        const c0 = starts[i] + (ends[i] - starts[i]) / 2;
        const along = (c0 - 0.5) * S;
        const pos = axisX
          ? new THREE.Vector3(x + along, 0, z + (rng() - 0.5) * 0.15)
          : new THREE.Vector3(x + (rng() - 0.5) * 0.15, 0, z + along);
        const dims = axisX ? [w * S, H, S * 0.96] : [S * 0.96, H, w * S];
        const drift = (0.18 + damage * 0.85) * (0.5 + rng() * 0.5);
        const away = (along >= 0 ? 1 : -1) * drift;
        const dir = axisX
          ? new THREE.Vector3(away, -(rng() * damage * 0.7), (rng() - 0.5) * damage * 0.6)
          : new THREE.Vector3((rng() - 0.5) * damage * 0.6, -(rng() * damage * 0.7), away);
        const rotBase = { x: 0, y: baseRotY + (rng() - 0.5) * 0.25, z: 0 };
        const rotDir = {
          x: (rng() - 0.5) * damage * 0.9,
          y: (rng() - 0.5) * damage * 0.9,
          z: (rng() - 0.5) * damage * 0.9
        };
        addPiece(dims, pos, rotBase, dir, rotDir, chocMaterial(rng));
      }

      // chocolate crumbs near broken cells
      if (damage > 0.45) {
        const crumbs = Math.floor(rng() * 3 * damage);
        for (let i = 0; i < crumbs; i++) {
          const s = 0.05 + rng() * 0.09;
          addPiece(
            [s, s, s],
            new THREE.Vector3(x + (rng() - 0.5) * 0.8, -0.1, z + (rng() - 0.5) * 0.8),
            { x: 0, y: 0, z: 0 },
            new THREE.Vector3((rng() - 0.5) * 1.6, -(0.2 + rng() * damage), (rng() - 0.5) * 1.6),
            new THREE.Vector3((rng() - 0.5) * 3, (rng() - 0.5) * 3, (rng() - 0.5) * 3),
            chocMaterial(rng)
          );
        }
      }
    }
  }
  scene.add(barGroup);
}

function animate() {
  requestAnimationFrame(animate);
  if (breaking && t < 1) t = Math.min(1, t + 0.005);
  const e = t * t; // ease-in: the bar resists, then gives way
  for (const p of pieces) {
    p.mesh.position.copy(p.base).addScaledVector(p.dir, e);
    p.mesh.rotation.set(
      p.rotBase.x + p.rotDir.x * e,
      p.rotBase.y + p.rotDir.y * e,
      p.rotBase.z + p.rotDir.z * e
    );
  }
  if (!dragging) theta += 0.0009;
  const hor = radius * Math.sin(phi);
  camera.position.set(target.x + hor * Math.sin(theta), radius * Math.cos(phi), target.z + hor * Math.cos(theta));
  camera.lookAt(target);
  renderer.render(scene, camera);
}

let dragging = false, lastX = 0, lastY = 0;
renderer.domElement.addEventListener('pointerdown', e => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
addEventListener('pointerup', () => dragging = false);
addEventListener('pointermove', e => {
  if (!dragging) return;
  theta -= (e.clientX - lastX) * 0.005;
  phi = Math.min(1.45, Math.max(0.15, phi - (e.clientY - lastY) * 0.005));
  lastX = e.clientX; lastY = e.clientY;
});
addEventListener('wheel', e => { radius = Math.min(60, Math.max(8, radius + e.deltaY * 0.02)); }, { passive: true });
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

document.getElementById('newBar').onclick = () => {
  seed = Math.floor(Math.random() * 1000000);
  t = 0; breaking = true; buildBar();
};
document.getElementById('replay').onclick = () => { t = 0; breaking = true; };
document.getElementById('chaos').oninput = e => {
  chaos = parseFloat(e.target.value);
  document.getElementById('chaosVal').textContent = chaos.toFixed(2);
  t = 0; breaking = true; buildBar();
};

buildBar();
animate();
</script>
</body>
</html>
